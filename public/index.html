<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة قدرات التعليمية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
        body { background: #f8fafc; color: #0f172a; display: flex; height: 100vh; overflow: hidden; }
        
        /* شاشة تسجيل الدخول */
        #auth-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f8fafc; display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .auth-card { background: #fff; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); width: 100%; max-width: 400px; text-align: center; }
        .auth-card h2 { color: #4f46e5; margin-bottom: 20px; font-weight: 900; }
        .auth-card input { width: 100%; padding: 12px 15px; margin-bottom: 15px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 15px; outline: none; }
        .auth-card input:focus { border-color: #4f46e5; }
        .auth-card button { width: 100%; padding: 12px; background: #4f46e5; color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .auth-card button:hover { background: #4338ca; }
        .msg { margin-top: 15px; font-size: 14px; font-weight: 600; }

        /* لوحة التحكم الرئيسية */
        .sidebar { width: 280px; background: #fff; border-left: 1px solid #e2e8f0; display: flex; flex-direction: column; padding: 25px; display: none; }
        .sidebar h3 { color: #4f46e5; margin-bottom: 30px; font-size: 20px; text-align: center; }
        .sidebar a, .sidebar button { padding: 12px 15px; margin-bottom: 10px; background: #f8fafc; color: #334155; text-decoration: none; border-radius: 10px; font-weight: 600; border: none; text-align: right; cursor: pointer; transition: 0.3s; display: block; }
        .sidebar a:hover, .sidebar button:hover { background: #eef2ff; color: #4f46e5; }
        .logout-btn { background: #fee2e2 !important; color: #dc2626 !important; margin-top: auto; }
        .logout-btn:hover { background: #fecaca !important; }

        .main-content { flex: 1; padding: 40px; overflow-y: auto; display: none; }
        .content-card { background: #fff; padding: 30px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); }
        
        .admin-only { display: none; }
    </style>
</head>
<body>

    <!-- نافذة تسجيل الدخول -->
    <div id="auth-container">
        <div class="auth-card">
            <h2>منصة قدرات</h2>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <input type="email" id="loginEmail" placeholder="البريد الإلكتروني" required>
                <input type="password" id="loginPass" placeholder="كلمة المرور" required>
                <button type="submit">تسجيل الدخول</button>
            </form>
            <div id="authMsg" class="msg"></div>
        </div>
    </div>

    <!-- القائمة الجانبية -->
    <div class="sidebar" id="sidebar">
        <h3>منصة قدرات 🎓</h3>
        <span id="userInfo" style="font-size: 13px; color: #64748b; margin-bottom: 20px; text-align: center; font-weight: 600;"></span>
        
        <a href="#" onclick="showSection('home')">🏠 الرئيسية</a>
        <a href="#" onclick="showSection('questions')">📚 التدريب والأسئلة</a>
        
        <!-- روابط خاصة بالمشرف فقط -->
        <div id="adminLinks" class="admin-only">
            <a href="#" onclick="showSection('addQ')">➕ إضافة سؤال جديد</a>
            <a href="admin.html" target="_blank">📂 تقرير الحسابات (API)</a>
        </div>

        <button class="logout-btn" onclick="logout()">🚪 تسجيل الخروج</button>
    </div>

    <!-- المحتوى الرئيسي -->
    <div class="main-content" id="mainContent">
        <div class="content-card" id="dynamicContent">
            <h2>مرحباً بك في منصة قدرات يا أكرم!</h2>
            <p style="margin-top: 10px; color: #64748b;">اختر من القائمة الجانبية للبدء.</p>
        </div>
    </div>

    <script>
        // التحقق من حالة الجلسة عند تحميل الصفحة لمنع الرجوع لصفحة الدخول عند الـ Refresh
        window.addEventListener('DOMContentLoaded', () => {
            const isLoggedIn = localStorage.getItem('isLoggedIn');
            if (isLoggedIn === 'true') {
                activateDashboard();
            }
        });

        // دالة تسجيل الدخول
        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPass').value;
            const msg = document.getElementById('authMsg');

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, pass })
                });
                const data = await res.json();

                if (data.success) {
                    // حفظ البيانات في LocalStorage لضمان استمرار الجلسة بعد الـ Refresh
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('userName', data.name);
                    localStorage.setItem('userEmail', data.email);
                    localStorage.setItem('userRole', data.role);

                    msg.style.color = 'green';
                    msg.textContent = '🎉 تم تسجيل الدخول بنجاح!';
                    
                    setTimeout(() => {
                        activateDashboard();
                    }, 500);
                } else {
                    msg.style.color = 'red';
                    msg.textContent = data.message;
                }
            } catch (err) {
                msg.style.color = 'red';
                msg.textContent = '❌ حدث خطأ في الاتصال بالخادم.';
            }
        }

        // تفعيل واجهة لوحة التحكم وإظهار القائمة الجانبية
        function activateDashboard() {
            document.getElementById('auth-container').style.display = 'none';
            document.getElementById('sidebar').style.display = 'flex';
            document.getElementById('mainContent').style.display = 'block';

            const role = localStorage.getItem('userRole');
            const name = localStorage.getItem('userName');
            
            document.getElementById('userInfo').textContent = `مرحباً: ${name} (${role === 'admin' ? 'مشرف' : 'طالب'})`;

            if (role === 'admin') {
                document.getElementById('adminLinks').style.display = 'block';
            }
        }

        // التبديل بين الأقسام
        function showSection(section) {
            const container = document.getElementById('dynamicContent');
            if (section === 'home') {
                container.innerHTML = `<h2>أهلاً بك مجدداً</h2><p style="margin-top:10px; color:#64748b;">منصتك التفاعلية للاختبارات والقدرات.</p>`;
            } else if (section === 'questions') {
                container.innerHTML = `<h2>📚 الأسئلة والتدريبات</h2><p style="margin-top:10px; color:#64748b;">قريباً سيتم عرض الأسئلة هنا...</p>`;
            } else if (section === 'addQ') {
                container.innerHTML = `<h2>➕ إضافة سؤال جديد</h2><p style="margin-top:10px; color:#64748b;">نموذج إضافة الأسئلة يعمل هنا.</p>`;
            }
        }

        // تسجيل الخروج ومسح الذاكرة
        function logout() {
            localStorage.clear();
            location.reload();
        }
    </script>
</body>
</html>
