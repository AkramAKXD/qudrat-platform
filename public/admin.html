<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المشرف - نظام الاختبارات</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background: #f4f7f6; display: flex; height: 100vh; overflow: hidden; }
        
        /* القائمة الجانبية */
        .sidebar { width: 260px; background: #2c3e50; color: white; height: 100%; padding: 20px; display: flex; flex-direction: column; }
        .sidebar h2 { font-size: 18px; text-align: center; margin-bottom: 30px; color: #ecf0f1; border-bottom: 1px solid #34495e; padding-bottom: 15px; }
        .sidebar a { display: block; color: #bdc3c7; text-decoration: none; padding: 12px 15px; margin-bottom: 8px; border-radius: 6px; transition: 0.3s; font-size: 15px; }
        .sidebar a:hover, .sidebar a.active { background: #34495e; color: white; }

        /* المحتوى الرئيسي */
        .main-content { flex: 1; padding: 30px; overflow-y: auto; background: #f4f7f6; }
        .admin-section { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .admin-section h2 { margin-bottom: 20px; color: #2c3e50; font-size: 22px; }

        /* الأقسام والتبويبات */
        .tabs-buttons { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #ecf0f1; padding-bottom: 15px; }
        .tabs-buttons button { padding: 10px 20px; cursor: pointer; border: none; background: #ecf0f1; color: #2c3e50; border-radius: 6px; font-weight: bold; transition: 0.3s; }
        .tabs-buttons button:hover, .tabs-buttons button.active-tab { background: #3498db; color: white; }

        /* جدول النماذج */
        .admin-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .admin-table th, .admin-table td { border: 1px solid #e1e8ed; padding: 12px; text-align: center; font-size: 14px; }
        .admin-table th { background-color: #f8f9fa; color: #2c3e50; font-weight: bold; }
        .admin-table tr:nth-child(even) { background-color: #fafbfc; }

        /* أزرار التنشيط والتعطيل */
        .btn-activate { padding: 6px 16px; background-color: #2ecc71; color: white; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; transition: 0.2s; }
        .btn-activate:hover { background-color: #27ae60; }
        
        .btn-deactivate { padding: 6px 16px; background-color: #e74c3c; color: white; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; transition: 0.2s; }
        .btn-deactivate:hover { background-color: #c0392b; }

        .status-active { color: #27ae60; font-weight: bold; }
        .status-inactive { color: #c0392b; font-weight: bold; }
    </style>
</head>
<body>

    <!-- القائمة الجانبية -->
    <div class="sidebar">
        <h2>لوحة المشرف</h2>
        <a href="#" onclick="switchTab('models-management', this)" class="active" id="default-tab">📁 نماذج الاختبارات</a>
        <a href="#" onclick="switchTab('users-management', this)">👥 إدارة المستخدمين</a>
        <a href="#" onclick="switchTab('questions-management', this)">❓ إدارة الأسئلة</a>
    </div>

    <!-- محتوى الصفحات -->
    <div class="main-content">
        
        <!-- قسم نماذج الاختبارات -->
        <div id="models-management" class="admin-section">
            <h2>إدارة نماذج الاختبارات وتنشيطها</h2>
            <div class="tabs-buttons">
                <button onclick="loadModels('quant', this)" class="active-tab" id="quant-btn">القسم الكمي</button>
                <button onclick="loadModels('verbal', this)">القسم اللفظي</button>
                <button onclick="loadModels('mock', this)">اختبار محاكي لقياس</button>
            </div>
            <div id="models-list-container">
                <p style="color: #7f8c8d;">جاري تحميل النماذج...</p>
            </div>
        </div>

        <!-- قسم إدارة المستخدمين -->
        <div id="users-management" class="admin-section" style="display:none;">
            <h2>إدارة المستخدمين</h2>
            <p style="color: #7f8c8d;">هنا يمكنك عرض وإدارة الحسابات المسجلة.</p>
        </div>

        <!-- قسم إدارة الأسئلة -->
        <div id="questions-management" class="admin-section" style="display:none;">
            <h2>إدارة الأسئلة</h2>
            <p style="color: #7f8c8d;">هنا يمكنك إضافة أو حذف الأسئلة.</p>
        </div>

    </div>

    <script>
        function switchTab(sectionId, element) {
            document.querySelectorAll('.admin-section').forEach(sec => sec.style.display = 'none');
            document.getElementById(sectionId).style.display = 'block';

            document.querySelectorAll('.sidebar a').forEach(a => a.classList.remove('active'));
            element.classList.add('active');

            if (sectionId === 'models-management') {
                document.getElementById('quant-btn').click();
            }
        }

        function loadModels(sectionKey, btnElement = null) {
            if (btnElement) {
                document.querySelectorAll('.tabs-buttons button').forEach(btn => btn.classList.remove('active-tab'));
                btnElement.classList.add('active-tab');
            }

            fetch('/api/admin/models-status')
                .then(res => res.json())
                .then(data => {
                    if (!data.success) return;
                    const sectionData = data.sections[sectionKey];
                    const container = document.getElementById('models-list-container');
                    
                    if (!sectionData || Object.keys(sectionData.models).length === 0) {
                        container.innerHTML = `<p style="color: #e74c3c; font-weight: bold; margin-top: 15px;">⚠️ لا توجد نماذج مضافة تحتوي على أسئلة في هذا القسم حالياً.</p>`;
                        return;
                    }

                    let html = `<h3>النماذج الخاصة بـ: ${sectionData.name}</h3>
                                <table class="admin-table">
                                    <thead>
                                        <tr>
                                            <th>رقم النموذج</th>
                                            <th>عدد الأسئلة</th>
                                            <th>الحالة الحالية</th>
                                            <th>الإجراء</th>
                                        </tr>
                                    </thead>
                                    <tbody>`;

                    for (const [modelNum, info] of Object.entries(sectionData.models)) {
                        html += `<tr>
                            <td>النموذج ${modelNum}</td>
                            <td>${info.count} أسئلة</td>
                            <td>
                                ${info.active 
                                    ? '<span class="status-active">🟢 منشط (يظهر للمستخدمين)</span>' 
                                    : '<span class="status-inactive">🔴 معطل (يحتاج إلى تنشيط)</span>'}
                            </td>
                            <td>
                                <button onclick="toggleModelStatus('${sectionKey}', ${modelNum}, ${!info.active})" 
                                        class="${info.active ? 'btn-deactivate' : 'btn-activate'}">
                                    ${info.active ? 'تعطيل' : 'تنشيط'}
                                </button>
                            </td>
                        </tr>`;
                    }
                    html += `</tbody></table>`;
                    container.innerHTML = html;
                })
                .catch(err => {
                    console.error('Error:', err);
                    document.getElementById('models-list-container').innerHTML = `<p style="color: red;">حدث خطأ أثناء جلب البيانات.</p>`;
                });
        }

        function toggleModelStatus(section, model, newActiveState) {
            fetch('/api/admin/toggle-model', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ section, model, active: newActiveState })
            })
            .then(res => res.json())
            .then(data => {
                alert(data.message);
                const activeBtn = document.querySelector('.tabs-buttons button.active-tab');
                if (activeBtn) activeBtn.click();
            })
            .catch(err => console.error('Error:', err));
        }

        window.onload = function() {
            loadModels('quant');
        };
    </script>
</body>
</html>
