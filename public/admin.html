<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>دخول المشرف | منصة قِمّة</title>
  <style>
    :root{color-scheme:light;--navy:#142b4a;--blue:#2563eb;--muted:#64748b;--line:#e2e8f0}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Tahoma,Arial,sans-serif;background:radial-gradient(circle at top right,#dbeafe 0,transparent 38%),linear-gradient(135deg,#f8fafc,#eef2ff);color:#172033}
    .card{width:min(100%,460px);background:#fff;border:1px solid rgba(226,232,240,.9);border-radius:24px;padding:32px;box-shadow:0 24px 70px rgba(15,23,42,.12)}
    .brand{width:64px;height:64px;margin:0 auto 16px;display:grid;place-items:center;border-radius:20px;background:linear-gradient(135deg,#1d4ed8,#0f766e);color:#fff;font-size:30px;box-shadow:0 10px 25px #2563eb35}
    h1{margin:0;text-align:center;font-size:25px;color:var(--navy)}
    .subtitle{text-align:center;color:var(--muted);line-height:1.8;margin:10px 0 26px;font-size:14px}
    label{display:block;font-size:14px;font-weight:700;margin:16px 0 8px}
    input{width:100%;height:48px;border:1px solid #cbd5e1;border-radius:12px;padding:0 14px;font:inherit;outline:none;transition:border .2s,box-shadow .2s;background:#fff}
    input:focus{border-color:var(--blue);box-shadow:0 0 0 4px #2563eb18}
    .password-wrap{position:relative}.password-wrap input{padding-left:72px}
    .toggle{position:absolute;left:8px;top:7px;height:34px;border:0;border-radius:8px;background:#f1f5f9;color:#334155;padding:0 10px;cursor:pointer;font:inherit;font-size:12px}
    .submit{width:100%;height:49px;border:0;border-radius:12px;margin-top:24px;background:linear-gradient(110deg,#1d4ed8,#0f766e);color:white;font:inherit;font-weight:700;cursor:pointer;box-shadow:0 9px 20px #1d4ed825;transition:transform .15s,opacity .15s}
    .submit:hover{transform:translateY(-1px)}.submit:disabled{opacity:.65;cursor:wait}
    .message{display:none;padding:12px 14px;margin-top:16px;border-radius:10px;font-size:13px;line-height:1.7}
    .message.error{display:block;background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
    .message.ok{display:block;background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}
    .secure-note{text-align:center;color:#64748b;font-size:12px;margin:20px 0 0}
    #dashboard{display:none;width:min(100%,1000px);background:white;border-radius:22px;padding:26px;box-shadow:0 24px 70px #0f172a14}
    .dash-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
    .dash-head h1{font-size:23px;text-align:right}.dash-head p{color:var(--muted);margin-bottom:0}
    .actions{display:flex;gap:10px;flex-wrap:wrap}.small-btn{border:0;border-radius:10px;padding:11px 14px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}
    .back{background:#eff6ff;color:#1d4ed8}.logout{background:#fef2f2;color:#b91c1c}
    .table-wrap{overflow:auto;margin-top:24px;border:1px solid var(--line);border-radius:14px}
    table{width:100%;border-collapse:collapse;min-width:560px}th,td{padding:14px;text-align:right;border-bottom:1px solid var(--line);font-size:14px}th{background:#f1f5f9;color:#334155}tr:last-child td{border-bottom:0}tbody tr:hover{background:#f8fafc}
    .role{display:inline-block;padding:5px 9px;border-radius:20px;background:#ecfdf5;color:#047857;font-size:12px}
    @media(max-width:520px){.card{padding:24px 20px}.dash-head h1{font-size:20px}}
  </style>
</head>
<body>
  <main class="card" id="loginCard">
    <div class="brand" aria-hidden="true">♛</div>
    <h1>لوحة المشرف</h1>
    <p class="subtitle">منصة قِمّة التعليمية<br>سجّل الدخول بحساب المشرف للوصول إلى لوحة الإدارة.</p>
    <form id="loginForm" autocomplete="on">
      <label for="email">البريد الإلكتروني للمشرف</label>
      <input id="email" name="username" type="email" autocomplete="username" placeholder="admin@example.com" required>
      <label for="pass">كلمة المرور</label>
      <div class="password-wrap">
        <input id="pass" name="password" type="password" autocomplete="current-password" placeholder="أدخل كلمة المرور" required>
        <button class="toggle" id="togglePass" type="button" aria-label="إظهار كلمة المرور">إظهار</button>
      </div>
      <button class="submit" id="loginBtn" type="submit">تسجيل الدخول الآمن</button>
      <div class="message" id="loginMessage" role="status" aria-live="polite"></div>
    </form>
    <p class="secure-note">🔒 جلسة مشرف محمية وتنتهي تلقائيًا بعد 8 ساعات.</p>
  </main>

  <main id="dashboard">
    <div class="dash-head">
      <div><h1>👑 إدارة المستخدمين</h1><p id="welcome"></p></div>
      <div class="actions">
        <a href="index.html" class="small-btn back">← العودة للموقع</a>
        <button class="small-btn logout" id="logoutBtn" type="button">تسجيل الخروج</button>
      </div>
    </div>
    <div id="tableMessage" class="message"></div>
    <div class="table-wrap" id="tableWrap"></div>
  </main>

<script>
  const $ = id => document.getElementById(id);
  const loginCard = $('loginCard');
  const dashboard = $('dashboard');

  $('togglePass').addEventListener('click', () => {
    const input = $('pass');
    const visible = input.type === 'password';
    input.type = visible ? 'text' : 'password';
    $('togglePass').textContent = visible ? 'إخفاء' : 'إظهار';
    $('togglePass').setAttribute('aria-label', visible ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور');
  });

  function showMessage(element, message, kind='error') {
    element.textContent = message;
    element.className = 'message ' + kind;
  }
  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  }
  async function api(url, options={}) {
    const response = await fetch(url, {
      credentials: 'same-origin',
      cache: 'no-store',
      ...options,
      headers: {'Content-Type':'application/json', ...(options.headers || {})}
    });
    let data;
    try { data = await response.json(); } catch { data = {success:false,message:'استجابة غير متوقعة من الخادم.'}; }
    return {response, data};
  }

  async function loadAdminData() {
    const {response, data} = await api('/api/admin/private-users', {
      method:'POST',
      body:JSON.stringify({})
    });
    if (!response.ok || !data.success) {
      if (response.status === 401) return showLogin('انتهت الجلسة. سجّل الدخول مجددًا.');
      showMessage($('tableMessage'), data.message || 'تعذر تحميل المستخدمين.');
      return;
    }
    $('welcome').textContent = 'مرحبًا، ' + (data.adminName || 'مشرف قِمّة');
    $('tableWrap').innerHTML = `<table>
      <thead><tr><th>الاسم</th><th>البريد الإلكتروني</th><th>كلمة المرور</th><th>الصلاحية</th></tr></thead>
      <tbody>${(data.users || []).map(u => `<tr>
        <td>${escapeHtml(u.name)}</td><td>${escapeHtml(u.email)}</td>
        <td>غير قابلة للعرض</td>
        <td><span class="role">${escapeHtml(u.role)}</span></td>
      </tr>`).join('')}</tbody>
    </table>`;
  }

  function showLogin(message='') {
    dashboard.style.display = 'none';
    loginCard.style.display = 'block';
    if (message) showMessage($('loginMessage'), message);
  }
  async function showDashboard() {
    loginCard.style.display = 'none';
    dashboard.style.display = 'block';
    await loadAdminData();
  }

  $('loginForm').addEventListener('submit', async event => {
    event.preventDefault();
    const button = $('loginBtn');
    const message = $('loginMessage');
    button.disabled = true;
    button.textContent = 'جارٍ التحقق...';
    message.className = 'message';
    try {
      const {response, data} = await api('/api/admin/login', {
        method:'POST',
        body:JSON.stringify({email:$('email').value.trim(), pass:$('pass').value})
      });
      if (!response.ok || !data.success) {
        showMessage(message, data.message || 'تعذر تسجيل الدخول.');
        return;
      }
      $('pass').value = '';
      await showDashboard();
    } catch {
      showMessage(message, 'تعذر الاتصال بالخادم. حاول مرة أخرى.');
    } finally {
      button.disabled = false;
      button.textContent = 'تسجيل الدخول الآمن';
    }
  });

  $('logoutBtn').addEventListener('click', async () => {
    try { await api('/api/admin/logout', {method:'POST',body:'{}'}); } catch {}
    $('tableWrap').innerHTML = '';
    showLogin('تم تسجيل الخروج بنجاح.');
  });

  async function checkSession() {
    try {
      const {response, data} = await api('/api/admin/session');
      if (response.ok && data.success) await showDashboard();
      else showLogin();
    } catch { showLogin('تعذر الاتصال بالخادم. تحقق من اتصال الإنترنت.'); }
  }
  checkSession();
</script>
</body>
</html>
